  E("human-genome","Human genome sequenced","🧫","tech",23,"firm","All 3 billion letters read. It confirms in detail what the fossils already suggested about our place on the tree of life.",2003),

/* ==================================================================== *
 * THEME
 * ==================================================================== */

const C = {
  bg:"#070b14", panel:"#101827", panel2:"#0b1220", border:"#1e2b41",
  ink:"#e8eef7", sub:"#8fa3bf", faint:"#5b6f8d",
  accent:"#ffc447", grid:"#16233a",
};

const MAX_YBP = 4.62e9;
const MIN_SPAN = 20;
const GUTTER = 174;
const GUTTER_NARROW = 94;
const NARROW_AT = 560;

const PRESETS = [
  { label:"All of time",       start: MAX_YBP,  end: 0 },
  { label:"Life on Earth",     start: 4.0e9,    end: 0 },
  { label:"Animals",           start: 620e6,    end: 0 },
  { label:"Age of dinosaurs",  start: 260e6,    end: 55e6 },
  { label:"Since the asteroid",start: 70e6,     end: 0 },
  { label:"Human story",       start: 8e6,      end: 0 },
  { label:"Ice age & us",      start: 320000,   end: 0 },
  { label:"Recorded history",  start: 7000,     end: 0 },
  { label:"Modern era",        start: 300,      end: 0 },
];

/* ==================================================================== *
 * TIME FORMATTING
 * ==================================================================== */

function num(x, dec) {
  let s = x.toFixed(dec);
  if (s.indexOf(".") >= 0) s = s.replace(/0+$/, "").replace(/\.$/, "");
  return s;
}

function decimalsFor(step, unit) {
  const s = step / unit;
  if (s >= 1) return 0;
  if (s >= 0.1) return 1;
  if (s >= 0.01) return 2;
  return 3;
}

/** Axis tick label. `step` sets precision so labels never show false detail. */
function fmtTick(v, step) {
  if (v <= 0.5) return "now";
  if (step < 2000) {
    const y = Math.round(REF_YEAR - v);
    if (y > 0) return String(y);
    return num(1 - y, 0) + " BCE";
  }
  if (v >= 1e9) return num(v / 1e9, decimalsFor(step, 1e9)) + " Ga";
  if (v >= 1e6) return num(v / 1e6, decimalsFor(step, 1e6)) + " Ma";
  if (v >= 1e3) return num(v / 1e3, decimalsFor(step, 1e3)) + "ka";
  return num(v, 0) + "y";
}

/** Rich, human-readable time for the detail panel. */
function fmtFull(v) {
  if (v <= 0.5) return "the present day";
  if (v >= 1e9) return num(v / 1e9, 2) + " billion years ago";
  if (v >= 1e6) return num(v / 1e6, 1) + " million years ago";
  if (v >= 10000) return Math.round(v).toLocaleString() + " years ago";
  const y = Math.round(REF_YEAR - v);
  const cal = y > 0 ? y + " CE" : (1 - y) + " BCE";
  return Math.round(v).toLocaleString() + " years ago (" + cal + ")";
}

function fmtDuration(a, b) {
  const d = a - b;
  if (d >= 1e9) return num(d / 1e9, 2) + " billion years";
  if (d >= 1e6) return num(d / 1e6, 1) + " million years";
  if (d >= 1e3) return Math.round(d).toLocaleString() + " years";
  return Math.round(d) + " years";
}

function fmtSpan(span) {
  if (span >= 1e9) return num(span / 1e9, 2) + " billion years";
  if (span >= 1e6) return num(span / 1e6, 1) + " million years";
  if (span >= 1e3) return Math.round(span).toLocaleString() + " years";
  return Math.round(span) + " years";
}

function niceStep(span, target) {
  const raw = span / target;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const mult = norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10;
  return mult * mag;
}

const evStart = (e) => (e.startYbp !== undefined ? e.startYbp : e.ybp);
const evEnd   = (e) => (e.endYbp   !== undefined ? e.endYbp   : e.ybp);
const isRange = (e) => e.startYbp !== undefined;

/* ==================================================================== *
 * ROOT
 * ==================================================================== */

function TimelineExplorer() {
  const [view, setView] = useState({ start: MAX_YBP, end: 0 });
  const [selected, setSelected] = useState(null);
  const [hidden, setHidden] = useState(new Set());
  const [query, setQuery] = useState("");
  const [listMode, setListMode] = useState(false);
  const [width, setWidth] = useState(900);
  const [winW, setWinW] = useState(() => (typeof window !== "undefined" ? window.innerWidth : 1200));

  // Orientation is sticky across visits: whichever one you chose is the one you
  // meant. Defaults to vertical on narrow screens, where horizontal panning of a
  // wide plot is genuinely awkward.
  const [orientation, setOrientation] = useState(() => {
    try {
      const saved = localStorage.getItem("deeptime-orientation");
      if (saved === "v" || saved === "h") return saved;
    } catch (err) { /* private mode */ }
    // Guard against a 0 width: an unlaid-out or hidden document reports 0, and
    // treating that as "narrow" would default desktop visitors to vertical.
    const w = typeof window !== "undefined" ? window.innerWidth : 0;
    return w > 0 && w < NARROW_AT ? "v" : "h";
  });
  useEffect(() => {
    try { localStorage.setItem("deeptime-orientation", orientation); } catch (err) { /* private mode */ }
  }, [orientation]);
  const vertical = orientation === "v";

  useEffect(() => {
    const onResize = () => setWinW(window.innerWidth);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);
  const narrow = winW < NARROW_AT;
  const gut = narrow ? GUTTER_NARROW : GUTTER;

  const plotRef = useRef(null);
  const drag = useRef(null);
  const pinch = useRef(null);

  /* --- responsive width ----------------------------------------- */
  useLayoutEffect(() => {
    const el = plotRef.current;
    if (!el) return;
    const ro = new ResizeObserver(() => setWidth(Math.max(240, el.clientWidth)));
    ro.observe(el);
    setWidth(Math.max(240, el.clientWidth));
    return () => ro.disconnect();
  }, [listMode]);

  const span = view.start - view.end;
  const xOf = useCallback((v) => ((view.start - v) / span) * width, [view, span, width]);
  const vAt = useCallback((x) => view.start - (x / width) * span, [view, span, width]);

  /* --- view manipulation ---------------------------------------- */
  const applyView = useCallback((start, end) => {
    let s = start, e = end, sp = s - e;
    if (sp < MIN_SPAN) { const m = (s + e) / 2; s = m + MIN_SPAN / 2; e = m - MIN_SPAN / 2; sp = MIN_SPAN; }
    if (sp > MAX_YBP)  { s = MAX_YBP; e = 0; sp = MAX_YBP; }
    if (e < 0)         { e = 0; s = sp; }
    if (s > MAX_YBP)   { s = MAX_YBP; e = Math.max(0, MAX_YBP - sp); }
    setView({ start: s, end: e });
  }, []);

  const zoomAt = useCallback((px, factor) => {
    const anchor = vAt(px);
    const newSpan = Math.min(MAX_YBP, Math.max(MIN_SPAN, span * factor));
    const s = anchor + (px / width) * newSpan;
    applyView(s, s - newSpan);
  }, [vAt, span, width, applyView]);

  const zoomTo = useCallback((a, b, pad = 0.12) => {
    const lo = Math.min(a, b), hi = Math.max(a, b);
    const sp = Math.max(hi - lo, MIN_SPAN);
    const p = sp * pad;
    applyView(hi + p, Math.max(0, lo - p));
  }, [applyView]);

  /* --- wheel: zoom (or pan with shift) --------------------------- */
  useEffect(() => {
    const el = plotRef.current;
    if (!el) return;
    const onWheel = (ev) => {
      ev.preventDefault();
      const rect = el.getBoundingClientRect();
      const px = ev.clientX - rect.left;
      if (ev.shiftKey) {
        const dv = (ev.deltaY / width) * span;
        applyView(view.start + dv, view.end + dv);
      } else {
        zoomAt(px, Math.exp(ev.deltaY * 0.0018));
      }
    };
    el.addEventListener("wheel", onWheel, { passive: false });
    return () => el.removeEventListener("wheel", onWheel);
  }, [zoomAt, applyView, view, span, width]);

  /* --- drag to pan ----------------------------------------------- */
  const onPointerDown = (ev) => {
    if (ev.button !== 0) return;
    drag.current = { x: ev.clientX, start: view.start, end: view.end, moved: false };
    ev.currentTarget.setPointerCapture?.(ev.pointerId);
  };
  const onPointerMove = (ev) => {
    const d = drag.current;
    if (!d) return;
    const dx = ev.clientX - d.x;
    if (Math.abs(dx) > 3) d.moved = true;
    const dv = (dx / width) * span;
    applyView(d.start + dv, d.end + dv);
  };
  const onPointerUp = () => { drag.current = null; };

  /* --- touch: pan + pinch ---------------------------------------- */
  const onTouchStart = (ev) => {
    if (ev.touches.length === 2) {
      const [a, b] = ev.touches;
      pinch.current = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), start: view.start, end: view.end };
      drag.current = null;
    } else if (ev.touches.length === 1) {
      drag.current = { x: ev.touches[0].clientX, start: view.start, end: view.end, moved: false };
    }
  };
  const onTouchMove = (ev) => {
    const el = plotRef.current;
    if (ev.touches.length === 2 && pinch.current && el) {
      ev.preventDefault();
      const [a, b] = ev.touches;
      const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      const rect = el.getBoundingClientRect();
      const px = (a.clientX + b.clientX) / 2 - rect.left;
      const p = pinch.current;
      const factor = Math.max(0.15, p.d / Math.max(dist, 1));
      const pSpan = p.start - p.end;
      const anchor = p.start - (px / width) * pSpan;
      const newSpan = Math.min(MAX_YBP, Math.max(MIN_SPAN, pSpan * factor));
      const s = anchor + (px / width) * newSpan;
      applyView(s, s - newSpan);
    } else if (ev.touches.length === 1 && drag.current) {
      ev.preventDefault();
      const d = drag.current;
      const dx = ev.touches[0].clientX - d.x;
      if (Math.abs(dx) > 3) d.moved = true;
      const dv = (dx / width) * span;
      applyView(d.start + dv, d.end + dv);
    }
  };
  const onTouchEnd = () => { drag.current = null; pinch.current = null; };

  /* --- keyboard --------------------------------------------------- */
  useEffect(() => {
    const onKey = (ev) => {
      if (ev.target.tagName === "INPUT") return;
      const pan = span * 0.18;
      if (ev.key === "ArrowLeft")  { applyView(view.start + pan, view.end + pan); ev.preventDefault(); }
      if (ev.key === "ArrowRight") { applyView(view.start - pan, view.end - pan); ev.preventDefault(); }
      if (ev.key === "=" || ev.key === "+") zoomAt(width / 2, 0.7);
      if (ev.key === "-" || ev.key === "_") zoomAt(width / 2, 1.4);
      if (ev.key === "Escape") setSelected(null);
      if (ev.key === "0") applyView(MAX_YBP, 0);
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [view, span, width, applyView, zoomAt]);

  /* --- search ------------------------------------------------------ */
  const matches = useMemo(() => {
    const q = query.trim().toLowerCase();
    if (!q) return null;
    return EVENTS.filter((e) =>
      e.label.toLowerCase().includes(q) ||
      e.blurb.toLowerCase().includes(q) ||
      CATEGORIES[e.category].name.toLowerCase().includes(q)
    );
  }, [query]);
  const matchIds = useMemo(() => (matches ? new Set(matches.map((m) => m.id)) : null), [matches]);

  /* --- visible ticks ------------------------------------------------ */
  const ticks = useMemo(() => {
    const step = niceStep(span, Math.max(3, Math.floor(width / 96)));
    const out = [];
    const first = Math.ceil(view.end / step) * step;
    for (let v = first; v <= view.start + step * 0.5; v += step) {
      if (v < view.end - step * 0.5) continue;
      out.push({ v, label: fmtTick(v, step) });
      if (out.length > 60) break;
    }
    return out;
  }, [view, span, width]);

  /* --- rows: one per category, sub-lane packed --------------------- */
  const rows = useMemo(() => {
    const LANE_H = 26, ROW_PAD = 7;
    let y = 0;
    const out = [];
    for (const cat of CAT_ORDER) {
      if (hidden.has(cat)) continue;
      const inCat = EVENTS.filter(
        (e) => e.category === cat && evStart(e) >= view.end && evEnd(e) <= view.start
      ).sort((a, b) => evStart(b) - evStart(a));

      // Greedy lane packing, capped. Past the cap an event keeps its mark but
      // loses its label and shares a lane — so a dense cluster collapses into a
      // readable row of dots instead of inflating the row to dozens of lanes.
      // Measured: raising this does NOT yield more labels. A labelled event
      // reserves its full text width in its lane, so extra lanes let early
      // events hoard space and starve later ones — 5 lanes labelled fewer
      // events than 3 while making every row 144px. Zoom in to read the rest.
      const MAX_LANES = 3;
      const lanes = [];
      const placed = [];
      for (const e of inCat) {
        const x1 = xOf(evStart(e));
        const x2 = xOf(evEnd(e));
        const textW = e.label.length * 6.15 + 30;
        const barOnly = Math.max(x2, x1 + 11);
        const withLabel = Math.max(x2, x1 + textW);

        // Prefer a lane where the label also fits; else open a new lane; else
        // drop the label and slot the bare mark into the first lane it fits.
        let li = lanes.findIndex((edge) => x1 > edge + 10);
        let labeled = true;
        if (li === -1) {
          if (lanes.length < MAX_LANES) { lanes.push(0); li = lanes.length - 1; }
          else {
            labeled = false;
            li = lanes.findIndex((edge) => x1 > edge + 3);
            if (li === -1) li = lanes.reduce((b, edge, i) => (edge < lanes[b] ? i : b), 0);
          }
        }
        lanes[li] = labeled ? withLabel : Math.max(lanes[li], barOnly);
        placed.push({ e, x1, x2, lane: li, labeled });
      }
      const h = Math.max(1, lanes.length) * LANE_H + ROW_PAD * 2;
      out.push({ cat, y, h, laneH: LANE_H, pad: ROW_PAD, placed, count: inCat.length });
      y += h;
    }
    return { list: out, total: y };
  }, [view, xOf, hidden]);

  /* --- geological bands visible in window --------------------------- */
  const bandRows = useMemo(() => {
    const ranks = ["eon", "era", "period", "epoch"];
    return ranks.map((rank) => ({
      rank,
      bands: SCALE.filter(
        (b) => b.rank === rank && b.startYbp > view.end && b.endYbp < view.start
      ),
    }));
  }, [view]);

  const toggleCat = (cat) =>
    setHidden((prev) => {
      const n = new Set(prev);
      n.has(cat) ? n.delete(cat) : n.add(cat);
      return n;
    });

  const visibleCount = rows.list.reduce((s, r) => s + r.count, 0);

  return (
    <div style={{ height:"100vh", display:"flex", flexDirection:"column",
      background:C.bg, color:C.ink, fontFamily:"'Nunito',system-ui,sans-serif", overflow:"hidden" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap');
        *{box-sizing:border-box;}
        .disp{font-family:'Baloo 2',cursive;}
        .mono{font-family:'Space Mono',monospace;}
        .btn{cursor:pointer;background:${C.panel2};border:1px solid ${C.border};color:${C.ink};
          border-radius:7px;padding:5px 11px;font:inherit;font-size:12px;font-weight:700;
          transition:background .12s,border-color .12s;white-space:nowrap;}
        .btn:hover{background:${C.border};border-color:${C.sub};}
        .btn[aria-pressed="true"]{background:${C.border};border-color:${C.accent};color:${C.accent};}
        .btn.off{opacity:.42;}
        .plot{cursor:grab;touch-action:none;}
        .plot:active{cursor:grabbing;}
        .ev{cursor:pointer;}
        .ev:hover .evlabel{fill:${C.accent};}
        .scrollArea{overflow-y:auto;overflow-x:hidden;flex:1;display:flex;}
        .scrollArea::-webkit-scrollbar{width:10px;}
        .scrollArea::-webkit-scrollbar-thumb{background:${C.border};border-radius:5px;}
        /* Vertical mode deliberately leaves touch-action alone so the browser
           keeps its own momentum scrolling — that is the point of this view. */
        .vscroll{-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
        .vscroll::-webkit-scrollbar{width:10px;}
        .vscroll::-webkit-scrollbar-thumb{background:${C.border};border-radius:5px;}
        .vrow:hover{background:${C.panel};border-radius:6px;}
        input{font-family:inherit;}
        table{border-collapse:collapse;width:100%;font-size:13px;}
        th,td{text-align:left;padding:7px 10px;border-bottom:1px solid ${C.border};vertical-align:top;}
        th{color:${C.sub};font-size:11px;text-transform:uppercase;letter-spacing:.08em;position:sticky;top:0;background:${C.panel2};}
        tr:hover td{background:${C.panel};}
      `}</style>

      {/* ---------- header ---------- */}
      <div style={{ padding:"10px 14px", background:C.panel, borderBottom:`1px solid ${C.border}`,
        display:"flex", gap:12, alignItems:"center", flexWrap:"wrap", flex:"none" }}>
        <div style={{ marginRight:"auto" }}>
          <h1 className="disp" style={{ fontSize:21, margin:0, lineHeight:1.1 }}>⏳ Deep Time</h1>
          <div style={{ color:C.sub, fontSize:11.5 }}>
            {vertical
              ? "Scroll to travel through time · pinch or ⌘-scroll to zoom"
              : "Scroll to zoom · drag to pan · click anything for detail"}
          </div>
        </div>
        <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search events…"
          style={{ width:narrow ? 130 : 180, background:C.panel2, border:`1px solid ${C.border}`,
            borderRadius:7, padding:"6px 10px", color:C.ink, fontSize:12.5, outline:"none" }} />
        {!listMode && (
          <button className="btn" onClick={() => setOrientation(vertical ? "h" : "v")}
            title={vertical ? "Switch to the horizontal timeline" : "Switch to the vertical timeline (better on phones)"}>
            {vertical ? "↔ Horizontal" : "↕ Vertical"}
          </button>
        )}
        <button className="btn" aria-pressed={listMode} onClick={() => setListMode((v) => !v)}>
          {listMode ? "◧ Timeline" : "☰ List"}
        </button>
      </div>

      {/* ---------- presets ---------- */}
      {!listMode && (
        <div style={{ padding:"7px 14px", background:C.panel2, borderBottom:`1px solid ${C.border}`,
          display:"flex", gap:6, flexWrap:"wrap", alignItems:"center", flex:"none" }}>
          <span style={{ fontSize:10.5, color:C.faint, fontWeight:800, letterSpacing:".09em" }}>JUMP TO</span>
          {PRESETS.map((p) => (
            <button key={p.label} className="btn" onClick={() => applyView(p.start, p.end)}>{p.label}</button>
          ))}
        </div>
      )}

      {listMode ? (
        <ListView query={query} onPick={(e) => { setListMode(false); setSelected(e); zoomTo(evStart(e), evEnd(e), 1.4); }} />
      ) : vertical ? (
        <VerticalView view={view} applyView={applyView} span={span} narrow={narrow}
          hidden={hidden} matchIds={matchIds}
          selected={selected} setSelected={setSelected}
          onZoomBand={(b) => zoomTo(b.startYbp, b.endYbp)} />
      ) : (
        <>
          {/* ---------- overview (log scale) ---------- */}
          <Overview view={view} onNavigate={applyView} gut={gut} narrow={narrow} />

          {/* ---------- axis + geological bands ---------- */}
          <div style={{ display:"flex", flex:"none", background:C.panel2, borderBottom:`1px solid ${C.border}` }}>
            <div style={{ width:gut, flex:"none", borderRight:`1px solid ${C.border}`,
              display:"flex", flexDirection:"column", justifyContent:"flex-end", padding:"0 9px 5px" }}>
              <div style={{ fontSize:narrow ? 8.5 : 10, color:C.faint, fontWeight:800, letterSpacing:".08em" }}>
                {narrow ? "GEO TIME" : "GEOLOGICAL TIME"}
              </div>
            </div>
            <div style={{ flex:1, minWidth:0 }}>
              <AxisAndBands width={width} ticks={ticks} bandRows={bandRows} xOf={xOf}
                view={view} onZoomBand={(b) => zoomTo(b.startYbp, b.endYbp)} />
            </div>
          </div>

          {/* ---------- main scrollable plot ---------- */}
          <div className="scrollArea">
            {/* gutter */}
            <div style={{ width:gut, flex:"none", borderRight:`1px solid ${C.border}`, background:C.panel2 }}>
              {rows.list.map((r) => {
                const cat = CATEGORIES[r.cat];
                const g = GROUPS[cat.group];
                return (
                  <div key={r.cat} title={cat.name} style={{ height:r.h, borderBottom:`1px solid ${C.grid}`,
                    padding:narrow ? "6px 6px" : "6px 9px", display:"flex", flexDirection:"column",
                    justifyContent:"center", gap:2, overflow:"hidden" }}>
                    <div style={{ display:"flex", alignItems:"center", gap:5 }}>
                      <span style={{ width:8, height:8, borderRadius:2, background:g.color, flex:"none" }} />
                      <span style={{ fontSize:narrow ? 15 : 12.5, fontWeight:700, lineHeight:1.15 }}>
                        {narrow ? cat.emoji : `${cat.emoji} ${cat.name}`}
                      </span>
                    </div>
                    <div className="mono" style={{ fontSize:10, color:C.faint, paddingLeft:narrow ? 0 : 14 }}>
                      {r.count}{narrow ? "" : " shown"}
                    </div>
                  </div>
                );
              })}
              <div style={{ height:20 }} />
            </div>

            {/* plot */}
            <div ref={plotRef} className="plot" style={{ flex:1, minWidth:0, position:"relative" }}
              onPointerDown={onPointerDown} onPointerMove={onPointerMove}
              onPointerUp={onPointerUp} onPointerCancel={onPointerUp}
              onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}>
              <svg width={width} height={rows.total + 20} style={{ display:"block" }}>
                {/* vertical gridlines */}
                {ticks.map((t, i) => (
                  <line key={i} x1={xOf(t.v)} y1={0} x2={xOf(t.v)} y2={rows.total}
                    stroke={C.grid} strokeWidth="1" />
                ))}
                {/* "now" marker */}
                {view.end <= 0 && (
                  <line x1={xOf(0)} y1={0} x2={xOf(0)} y2={rows.total}
                    stroke={C.accent} strokeWidth="1.5" strokeDasharray="3 4" opacity="0.55" />
                )}

                {rows.list.map((r) => (
                  <g key={r.cat} transform={`translate(0,${r.y})`}>
                    <line x1="0" y1={r.h - 0.5} x2={width} y2={r.h - 0.5} stroke={C.grid} strokeWidth="1" />
                    {r.placed.map((p) => (
                      <EventMark key={p.e.id} p={p} row={r} width={width}
                        dim={matchIds ? !matchIds.has(p.e.id) : false}
                        isSelected={selected && selected.id === p.e.id}
                        onPick={() => { if (!drag.current || !drag.current.moved) setSelected(p.e); }} />
                    ))}
                  </g>
                ))}
              </svg>
            </div>
          </div>

        </>
      )}

      {/* ---------- footer: legend + filters + status (shared) ---------- */}
      {!listMode && (
        <div style={{ padding:"7px 14px", background:C.panel, borderTop:`1px solid ${C.border}`,
          display:"flex", gap:14, alignItems:"center", flexWrap:"wrap", flex:"none", fontSize:11.5 }}>
          <div style={{ display:"flex", gap:10, alignItems:"center" }}>
            {Object.entries(GROUPS).map(([k, g]) => (
              <span key={k} style={{ display:"flex", alignItems:"center", gap:5 }}>
                <span style={{ width:10, height:10, borderRadius:3, background:g.color }} />
                <span style={{ color:C.sub }}>{g.name}</span>
              </span>
            ))}
          </div>
          {!narrow && <span style={{ color:C.faint }}>|</span>}
          {!narrow && (
            <div style={{ display:"flex", gap:10, alignItems:"center", color:C.sub }}>
              <span style={{ display:"flex", alignItems:"center", gap:5 }}>
                <svg width="14" height="14"><circle cx="7" cy="7" r="4.5" fill={C.sub} /></svg> certain
              </span>
              <span style={{ display:"flex", alignItems:"center", gap:5 }}>
                <svg width="14" height="14"><circle cx="7" cy="7" r="4.5" fill="none" stroke={C.sub} strokeWidth="1.6" strokeDasharray="2 1.6" /></svg> debated
              </span>
            </div>
          )}
          <div style={{ marginLeft:"auto", display:"flex", gap:5, flexWrap:"wrap" }}>
            {CAT_ORDER.map((cat) => (
              <button key={cat} className={"btn" + (hidden.has(cat) ? " off" : "")}
                onClick={() => toggleCat(cat)} title={`Show / hide ${CATEGORIES[cat].name}`}
                style={{ padding:"3px 7px", fontSize:11 }}>
                {CATEGORIES[cat].emoji}
              </button>
            ))}
          </div>
          <span className="mono" style={{ color:C.faint, fontSize:10.5 }}>
            window {fmtSpan(span)} · {visibleCount} events
          </span>
        </div>
      )}

      {selected && (
        <DetailPanel e={selected} onClose={() => setSelected(null)}
          onZoom={() => zoomTo(evStart(selected), evEnd(selected), 1.4)} />
      )}
    </div>
  );
}

/* ==================================================================== *
 * EVENT MARK
 * ==================================================================== */

function EventMark({ p, row, width, dim, isSelected, onPick }) {
  const { e, x1, x2, lane, labeled } = p;
  const cat = CATEGORIES[e.category];
  const color = GROUPS[cat.group].color;
  const cy = row.pad + lane * row.laneH + row.laneH / 2;
  const range = isRange(e);
  const debated = e.certainty === "debated";
  const approx = e.certainty === "approximate";

  // Keep the label on screen when the mark itself has scrolled off the left edge.
  const labelX = Math.max(4, x1 + (range ? 0 : 9));
  const opacity = dim ? 0.2 : 1;

  return (
    <g className="ev" opacity={opacity} onClick={(ev) => { ev.stopPropagation(); onPick(); }}>
      <title>{e.emoji + " " + e.label}</title>
      {range ? (
        <rect x={x1} y={cy - 6} width={Math.max(2.5, x2 - x1)} height={12} rx={4}
          fill={color} fillOpacity={debated ? 0.16 : approx ? 0.42 : 0.72}
          stroke={color} strokeWidth={isSelected ? 2 : 1.4}
          strokeDasharray={debated ? "3 2.5" : "none"} />
      ) : (
        <circle cx={x1} cy={cy} r={isSelected ? 6.5 : 5}
          fill={debated ? C.bg : color}
          stroke={debated || approx ? color : "none"} strokeWidth={1.8}
          strokeDasharray={debated ? "2.4 1.9" : "none"} />
      )}
      {isSelected && (
        <circle cx={range ? (x1 + x2) / 2 : x1} cy={cy} r={11}
          fill="none" stroke={C.accent} strokeWidth="1.5" opacity="0.8" />
      )}
      {labeled && (
        <text className="evlabel" x={labelX + (range ? 7 : 0)} y={cy + 4}
          fontSize="11.5" fill={isSelected ? C.accent : C.ink}
          fontWeight={isSelected ? 800 : 600} style={{ pointerEvents:"none" }}>
          {e.emoji} {e.label}
        </text>
      )}
    </g>
  );
}

/* ==================================================================== *
 * AXIS + GEOLOGICAL BANDS
 * ==================================================================== */

function AxisAndBands({ width, ticks, bandRows, xOf, view, onZoomBand }) {
  const BAND_H = 19, AXIS_H = 20;
  const totalH = AXIS_H + bandRows.length * BAND_H + 3;

  return (
    <svg width={width} height={totalH} style={{ display:"block" }}>
      {/* axis */}
      {ticks.map((t, i) => {
        const x = xOf(t.v);
        // Anchor edge labels inward so they are never clipped by the viewport.
        const anchor = x < 26 ? "start" : x > width - 26 ? "end" : "middle";
        const tx = anchor === "start" ? 1 : anchor === "end" ? width - 1 : x;
        return (
          <g key={i}>
            <line x1={x} y1={AXIS_H - 5} x2={x} y2={AXIS_H} stroke={C.faint} strokeWidth="1" />
            <text x={tx} y={AXIS_H - 8} textAnchor={anchor} fontSize="10"
              fill={C.sub} className="mono">{t.label}</text>
          </g>
        );
      })}

      {/* bands */}
      {bandRows.map((br, ri) => (
        <g key={br.rank} transform={`translate(0,${AXIS_H + ri * BAND_H})`}>
          {br.bands.map((b) => {
            const bx1 = Math.max(-2, xOf(b.startYbp));
            const bx2 = Math.min(width + 2, xOf(b.endYbp));
            const w = bx2 - bx1;
            if (w < 1.5) return null;
            const label = b.name;
            const fits = w > label.length * 5.6 + 10;
            // Sticky label: keep it inside the visible slice of a band that
            // extends past the viewport, so you always know where you are.
            const cx = Math.min(Math.max((bx1 + bx2) / 2, bx1 + 4), bx2 - 4);
            return (
              <g key={b.id} onClick={() => onZoomBand(b)} style={{ cursor:"zoom-in" }}>
                <title>{b.name}{b.blurb ? " — " + b.blurb : ""}</title>
                <rect x={bx1 + 0.5} y={1} width={Math.max(1, w - 1)} height={BAND_H - 3} rx={3}
                  fill={C.panel} stroke={C.border} strokeWidth="1" />
                {fits && (
                  <text x={cx} y={BAND_H - 7} textAnchor="middle" fontSize="10"
                    fill={C.sub} fontWeight="700" style={{ pointerEvents:"none" }}>{label}</text>
                )}
              </g>
            );
          })}
        </g>
      ))}
    </svg>
  );
}

/* ==================================================================== *
 * OVERVIEW STRIP (log scale — the whole 4.5 Ga at once)
 * ==================================================================== */

const LOG_MIN = 10;
const logX = (v, w) => {
  const hi = Math.log10(MAX_YBP), lo = Math.log10(LOG_MIN);
  const c = Math.log10(Math.max(LOG_MIN, Math.min(MAX_YBP, v)));
  return ((hi - c) / (hi - lo)) * w;
};

function Overview({ view, onNavigate, gut = GUTTER, narrow = false }) {
  const ref = useRef(null);
  const [w, setW] = useState(900);
  const drag = useRef(false);
  const H = 40;

  useLayoutEffect(() => {
    const el = ref.current;
    if (!el) return;
    const ro = new ResizeObserver(() => setW(Math.max(200, el.clientWidth)));
    ro.observe(el);
    setW(Math.max(200, el.clientWidth));
    return () => ro.disconnect();
  }, []);

  const jump = useCallback((clientX) => {
    const el = ref.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    const frac = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
    const hi = Math.log10(MAX_YBP), lo = Math.log10(LOG_MIN);
    const center = Math.pow(10, hi - frac * (hi - lo));
    const span = view.start - view.end;
    onNavigate(center + span / 2, center - span / 2);
  }, [view, onNavigate]);

  const x1 = logX(view.start, w), x2 = logX(view.end, w);
  // Spread on the log axis — "life" (3.8 Ga) sits ~12px from "Earth" and is dropped.
  // Narrow screens keep only the widely-separated landmarks.
  const marks = narrow
    ? [{ v: 4540e6, t: "Earth" }, { v: 66e6, t: "asteroid" }, { v: LOG_MIN, t: "now" }]
    : [
        { v: 4540e6, t: "Earth" }, { v: 538.8e6, t: "animals" },
        { v: 66e6, t: "asteroid" }, { v: 300000, t: "us" }, { v: 5226, t: "writing" },
        { v: LOG_MIN, t: "now" },
      ];

  return (
    <div style={{ display:"flex", flex:"none", background:C.bg, borderBottom:`1px solid ${C.border}` }}>
      <div style={{ width:gut, flex:"none", borderRight:`1px solid ${C.border}`,
        padding:"0 9px", display:"flex", alignItems:"center" }}>
        <span style={{ fontSize:narrow ? 8.5 : 10, color:C.faint, fontWeight:800, letterSpacing:".08em" }}>
          ALL OF TIME
        </span>
      </div>
      <div ref={ref} style={{ flex:1, minWidth:0, cursor:"crosshair" }}
        onPointerDown={(e) => { drag.current = true; jump(e.clientX); }}
        onPointerMove={(e) => { if (drag.current) jump(e.clientX); }}
        onPointerUp={() => { drag.current = false; }}
        onPointerLeave={() => { drag.current = false; }}>
        <svg width={w} height={H} style={{ display:"block" }}>
          <rect x="0" y="13" width={w} height="14" rx="4" fill={C.panel2} stroke={C.border} />
          {/* every event as a faint tick, coloured by group */}
          {EVENTS.map((e) => {
            const x = logX(evStart(e), w);
            return <line key={e.id} x1={x} y1="15" x2={x} y2="25" strokeWidth="1.4"
              stroke={GROUPS[CATEGORIES[e.category].group].color} opacity="0.5" />;
          })}
          {/* current window */}
          <rect x={Math.min(x1, x2)} y="10" width={Math.max(3, Math.abs(x2 - x1))} height="20"
            rx="4" fill={C.accent} fillOpacity="0.2" stroke={C.accent} strokeWidth="1.5" />
          {marks.map((m) => {
            const mx = logX(m.v, w);
            const anchor = mx < 18 ? "start" : mx > w - 18 ? "end" : "middle";
            return (
              <text key={m.t} x={anchor === "end" ? w - 1 : anchor === "start" ? 1 : mx}
                y="38" textAnchor={anchor} fontSize="9" fill={C.faint} className="mono">{m.t}</text>
            );
          })}
        </svg>
      </div>
    </div>
  );
}

/* ==================================================================== *
 * VERTICAL VIEW
 *
 * Time runs top (oldest) -> bottom (now), and the browser's own vertical
 * scroll is the only thing that pans. Nothing calls preventDefault on a plain
 * wheel or a one-finger drag, which is the whole point: the horizontal view
 * has to hijack both to work, and that is what makes it awkward on a trackpad
 * or a phone. Zooming is therefore explicit — buttons, pinch, or the standard
 * ctrl/cmd+wheel idiom — rather than stealing the scroll gesture.
 *
 * Events form one time-ordered stream instead of eight category rows: on a
 * 375px screen eight columns would be unreadable. Category identity moves onto
 * each event as an emoji plus a coloured group dot, and the rows stay wide
 * enough to hold a real label.
 * ==================================================================== */

function fmtCompact(v) {
  if (v <= 0.5) return "now";
  if (v >= 1e9) return num(v / 1e9, 2) + " Ga";
  if (v >= 1e6) return num(v / 1e6, 1) + " Ma";
  if (v >= 10000) return num(v / 1000, 0) + " ka";
  const y = Math.round(REF_YEAR - v);
  return y > 0 ? y + " CE" : (1 - y) + " BCE";
}

function VerticalView({ view, applyView, span, narrow, hidden, matchIds, selected, setSelected, onZoomBand }) {
  const scrollRef = useRef(null);
  const [vh, setVh] = useState(600);
  const [availW, setAvailW] = useState(700);
  const [scrollTop, setScrollTop] = useState(0);
  const pinch = useRef(null);
  const anchor = useRef(null);
  const raf = useRef(0);

  // Scroll position is only needed to pin geological labels, so coalesce it to
  // one update per frame rather than re-rendering on every scroll event.
  const onScroll = useCallback((ev) => {
    const t = ev.currentTarget.scrollTop;
    cancelAnimationFrame(raf.current);
    raf.current = requestAnimationFrame(() => setScrollTop(t));
  }, []);
  useEffect(() => () => cancelAnimationFrame(raf.current), []);

  const AXIS_W = narrow ? 48 : 68;
  const GEO_COL_W = narrow ? 26 : 30;
  const RAIL_W = narrow ? 16 : 24;
  // One lane on phones: two lanes fit more labels but truncate every one of
  // them ("Ordovicia…"), which is worse than showing fewer in full. The
  // range-blocking cap below is what actually frees up labels here.
  const MAX_VLANES = narrow ? 1 : 3;

  useLayoutEffect(() => {
    const el = scrollRef.current;
    if (!el) return;
    const measure = () => { setVh(el.clientHeight); setAvailW(el.clientWidth); };
    const ro = new ResizeObserver(measure);
    ro.observe(el);
    measure();
    return () => ro.disconnect();
  }, []);

  const visible = useMemo(
    () => EVENTS
      .filter((e) => !hidden.has(e.category) && evStart(e) >= view.end && evEnd(e) <= view.start)
      .sort((a, b) => evStart(b) - evStart(a)),
    [view, hidden]
  );

  // Tall enough that dense windows get breathing room, but always at least a
  // couple of screens so scrolling feels like travel rather than a nudge.
  const contentH = Math.max(vh * 2.2, visible.length * 46 + 240);
  const yOf = (v) => ((view.start - v) / span) * contentH;
  const timeAtY = (y) => view.start - (y / contentH) * span;

  const geoCols = useMemo(() => {
    const ranks = narrow ? ["era", "period"] : ["eon", "era", "period", "epoch"];
    return ranks
      .map((rank) => ({
        rank,
        bands: SCALE.filter((b) => b.rank === rank && b.startYbp > view.end && b.endYbp < view.start),
      }))
      .filter((c) => c.bands.length > 0);
  }, [view, narrow]);

  const GEO_W = geoCols.length * GEO_COL_W;
  const streamX = AXIS_W + GEO_W + 10;
  const laneW = Math.max(narrow ? 116 : 190, (availW - streamX - 8) / MAX_VLANES);

  const ticks = useMemo(() => {
    const step = niceStep(span, Math.max(4, Math.min(80, Math.floor(contentH / 110))));
    const out = [];
    const first = Math.ceil(view.end / step) * step;
    for (let v = first; v <= view.start + step * 0.5; v += step) {
      if (v < view.end - step * 0.5) continue;
      out.push({ v, label: fmtTick(v, step) });
      if (out.length > 300) break;
    }
    return out;
  }, [view, span, contentH]);

  /* --- lane packing, transposed from the horizontal view --- */
  const placed = useMemo(() => {
    const laneBottom = [];
    const out = [];
    for (const e of visible) {
      const y1 = yOf(evStart(e));
      const y2 = yOf(evEnd(e));
      // A range only reserves its label's worth of lane (plus a little), not
      // its whole duration. Otherwise one long bar — the Ediacaran, the ice
      // ages — silently strips the labels off everything inside it. The bar
      // still draws full height and simply passes behind the later rows.
      const needLabel = Math.max(Math.min(y2, y1 + 110), y1 + 34);
      const needBare = Math.max(Math.min(y2, y1 + 60), y1 + 12);
      let li = laneBottom.findIndex((b) => y1 > b + 4);
      let labeled = true;
      if (li === -1) {
        if (laneBottom.length < MAX_VLANES) { laneBottom.push(0); li = laneBottom.length - 1; }
        else {
          labeled = false;
          li = laneBottom.findIndex((b) => y1 > b + 2);
          if (li === -1) li = laneBottom.reduce((best, b, i) => (b < laneBottom[best] ? i : best), 0);
        }
      }
      laneBottom[li] = labeled ? needLabel : Math.max(laneBottom[li], needBare);
      out.push({ e, y1, y2, lane: li, labeled });
    }
    return out;
  }, [visible, contentH, view, MAX_VLANES]);

  /* --- zoom keeps the middle of the screen pinned --- */
  const zoomBy = useCallback((factor) => {
    const el = scrollRef.current;
    const centerT = timeAtY((el ? el.scrollTop : 0) + vh / 2);
    anchor.current = centerT;
    const ns = Math.min(MAX_YBP, Math.max(MIN_SPAN, span * factor));
    applyView(centerT + ns / 2, centerT - ns / 2);
  }, [span, vh, applyView, view, contentH]);

  // Restore the anchored time after a zoom; a view change with no anchor (a
  // preset) starts at the top, which is the oldest end.
  useLayoutEffect(() => {
    const el = scrollRef.current;
    if (!el) return;
    if (anchor.current != null) {
      el.scrollTop = Math.max(0, yOf(anchor.current) - vh / 2);
      anchor.current = null;
    } else {
      el.scrollTop = 0;
    }
  }, [view]);

  // Bring an off-screen selection into view without yanking a visible one.
  useEffect(() => {
    const el = scrollRef.current;
    if (!el || !selected) return;
    const y = yOf(evStart(selected));
    if (y < el.scrollTop + 16 || y > el.scrollTop + vh - 16) {
      el.scrollTo({ top: Math.max(0, y - vh * 0.35), behavior: "smooth" });
    }
  }, [selected]);

  /* --- ctrl/cmd + wheel zooms; a plain wheel scrolls normally --- */
  useEffect(() => {
    const el = scrollRef.current;
    if (!el) return;
    const onWheel = (ev) => {
      if (!ev.ctrlKey && !ev.metaKey) return;   // leave native scrolling alone
      ev.preventDefault();
      zoomBy(Math.exp(ev.deltaY * 0.002));
    };
    el.addEventListener("wheel", onWheel, { passive: false });
    return () => el.removeEventListener("wheel", onWheel);
  }, [zoomBy]);

  /* --- two-finger pinch zooms; one finger is left to scroll --- */
  const onTouchStart = (ev) => {
    if (ev.touches.length === 2) {
      const [a, b] = ev.touches;
      pinch.current = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), start: view.start, end: view.end };
    }
  };
  const onTouchMove = (ev) => {
    if (ev.touches.length !== 2 || !pinch.current) return;
    ev.preventDefault();
    const [a, b] = ev.touches;
    const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    const p = pinch.current;
    const pSpan = p.start - p.end;
    const el = scrollRef.current;
    const rect = el.getBoundingClientRect();
    const midY = (a.clientY + b.clientY) / 2 - rect.top + el.scrollTop;
    const anchorT = p.start - (midY / contentH) * pSpan;
    const ns = Math.min(MAX_YBP, Math.max(MIN_SPAN, pSpan * Math.max(0.15, p.d / Math.max(dist, 1))));
    anchor.current = anchorT;
    applyView(anchorT + ns / 2, anchorT - ns / 2);
  };
  const onTouchEnd = () => { pinch.current = null; };

  const nowY = view.end <= 0 ? yOf(0) : null;

  return (
    <div style={{ flex:1, display:"flex", minHeight:0, position:"relative" }}>
      <div ref={scrollRef} className="vscroll" onScroll={onScroll}
        style={{ flex:1, overflowY:"auto", overflowX:"hidden", minWidth:0 }}
        onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}>
        <div style={{ position:"relative", height:contentH }}>

          {/* time gridlines + axis labels */}
          {ticks.map((t, i) => {
            const y = yOf(t.v);
            return (
              <div key={i} style={{ position:"absolute", top:y, left:0, right:0, height:0 }}>
                <div style={{ position:"absolute", left:AXIS_W, right:0, top:0,
                  borderTop:`1px solid ${C.grid}` }} />
                <div className="mono" style={{ position:"absolute", left:0, top:-7, width:AXIS_W - 8,
                  textAlign:"right", fontSize:narrow ? 8.5 : 9.5, color:C.sub, whiteSpace:"nowrap" }}>
                  {t.label}
                </div>
              </div>
            );
          })}

          {/* "now" line */}
          {nowY !== null && (
            <div style={{ position:"absolute", top:nowY, left:AXIS_W, right:0,
              borderTop:`1.5px dashed ${C.accent}`, opacity:.55 }} />
          )}

          {/* geological column */}
          {geoCols.map((col, ci) => (
            <div key={col.rank}>
              {col.bands.map((b) => {
                const top = Math.max(0, yOf(b.startYbp));
                const bottom = Math.min(contentH, yOf(b.endYbp));
                const h = bottom - top;
                if (h < 2) return null;
                // Bands here run thousands of pixels tall, so a centred label is
                // almost never on screen. Pin it inside the visible slice.
                const labelLen = b.name.length * 6.3 + 10;
                const off = Math.min(Math.max(scrollTop + 14 - top, 0), Math.max(0, h - labelLen));
                return (
                  <div key={b.id} title={b.name + (b.blurb ? " — " + b.blurb : "")}
                    onClick={() => onZoomBand(b)}
                    style={{ position:"absolute", top, height:h,
                      left:AXIS_W + ci * GEO_COL_W + 1, width:GEO_COL_W - 2,
                      background:C.panel, border:`1px solid ${C.border}`, borderRadius:4,
                      cursor:"zoom-in", overflow:"hidden" }}>
                    {h > 46 && (
                      <span style={{ position:"absolute", top:off, left:0, right:0,
                        display:"flex", justifyContent:"center" }}>
                        <span style={{ writingMode:"vertical-rl", transform:"rotate(180deg)",
                          fontSize:9.5, fontWeight:700, color:C.sub, whiteSpace:"nowrap",
                          letterSpacing:".03em" }}>{b.name}</span>
                      </span>
                    )}
                  </div>
                );
              })}
            </div>
          ))}

          {/* events */}
          {placed.map((p) => {
            const e = p.e;
            const cat = CATEGORIES[e.category];
            const color = GROUPS[cat.group].color;
            const dim = matchIds ? !matchIds.has(e.id) : false;
            const sel = selected && selected.id === e.id;
            const range = isRange(e);
            const debated = e.certainty === "debated";
            const approx = e.certainty === "approximate";
            const barH = Math.max(4, p.y2 - p.y1);
            return (
              <div key={e.id} className="vrow" title={e.emoji + " " + e.label}
                onClick={() => setSelected(e)}
                style={{ position:"absolute", top:p.y1 - 7, left:streamX + p.lane * laneW,
                  width:laneW - 10, cursor:"pointer", opacity:dim ? 0.22 : 1,
                  transition:"opacity .2s", display:"flex", gap:8, alignItems:"flex-start" }}>
                <span style={{ width:12, flex:"none", display:"flex", justifyContent:"center", paddingTop:5 }}>
                  {range ? (
                    <span style={{ width:6, height:barH, borderRadius:3, background:color,
                      opacity:debated ? 0.3 : approx ? 0.62 : 1,
                      border:debated ? `1px dashed ${color}` : "none",
                      boxShadow:sel ? `0 0 0 2px ${C.accent}` : "none" }} />
                  ) : (
                    <span style={{ width:10, height:10, borderRadius:"50%",
                      background:debated ? C.bg : color,
                      border:`2px solid ${color}`,
                      borderStyle:debated ? "dashed" : "solid",
                      boxShadow:sel ? `0 0 0 3px ${C.accent}` : "none" }} />
                  )}
                </span>
                {p.labeled && (
                  <span style={{ minWidth:0, flex:1 }}>
                    <span style={{ display:"block", fontSize:narrow ? 13 : 12.5,
                      fontWeight:700, lineHeight:1.25, color:sel ? C.accent : C.ink,
                      overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
                      {e.emoji} {e.label}
                    </span>
                    <span className="mono" style={{ display:"block", fontSize:9.5, color:C.faint,
                      marginTop:1, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>
                      {fmtCompact(evStart(e))}{range ? " → " + fmtCompact(e.endYbp) : ""}
                    </span>
                  </span>
                )}
              </div>
            );
          })}
        </div>
      </div>

      <VRail view={view} applyView={applyView} w={RAIL_W} />

      {/* zoom controls — vertical mode has no wheel-zoom to fall back on */}
      <div style={{ position:"absolute", right:RAIL_W + 10, bottom:14, zIndex:20,
        display:"flex", flexDirection:"column", gap:5 }}>
        <button className="btn" title="Zoom in" onClick={() => zoomBy(0.55)}
          style={{ width:32, height:32, padding:0, fontSize:16, lineHeight:1 }}>+</button>
        <button className="btn" title="Zoom out" onClick={() => zoomBy(1.8)}
          style={{ width:32, height:32, padding:0, fontSize:16, lineHeight:1 }}>−</button>
      </div>
    </div>
  );
}

/* Vertical twin of the log-scale overview strip. */
function VRail({ view, applyView, w }) {
  const ref = useRef(null);
  const [h, setH] = useState(400);
  const drag = useRef(false);

  useLayoutEffect(() => {
    const el = ref.current;
    if (!el) return;
    const ro = new ResizeObserver(() => setH(Math.max(80, el.clientHeight)));
    ro.observe(el);
    setH(Math.max(80, el.clientHeight));
    return () => ro.disconnect();
  }, []);

  const logY = (v) => {
    const hi = Math.log10(MAX_YBP), lo = Math.log10(LOG_MIN);
    const c = Math.log10(Math.max(LOG_MIN, Math.min(MAX_YBP, v)));
    return ((hi - c) / (hi - lo)) * h;
  };

  const jump = (clientY) => {
    const el = ref.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    const frac = Math.min(1, Math.max(0, (clientY - rect.top) / rect.height));
    const hi = Math.log10(MAX_YBP), lo = Math.log10(LOG_MIN);
    const center = Math.pow(10, hi - frac * (hi - lo));
    const span = view.start - view.end;
    applyView(center + span / 2, center - span / 2);
  };

  const y1 = logY(view.start), y2 = logY(view.end);

  return (
    <div ref={ref} style={{ width:w, flex:"none", borderLeft:`1px solid ${C.border}`,
      background:C.panel2, position:"relative", cursor:"crosshair", touchAction:"none" }}
      onPointerDown={(e) => { drag.current = true; e.currentTarget.setPointerCapture?.(e.pointerId); jump(e.clientY); }}
      onPointerMove={(e) => { if (drag.current) jump(e.clientY); }}
      onPointerUp={() => { drag.current = false; }}
      onPointerCancel={() => { drag.current = false; }}>
      {EVENTS.map((e) => (
        <div key={e.id} style={{ position:"absolute", top:logY(evStart(e)), left:2, right:2, height:1.5,
          background:GROUPS[CATEGORIES[e.category].group].color, opacity:.5 }} />
      ))}
      <div style={{ position:"absolute", top:Math.min(y1, y2), height:Math.max(4, Math.abs(y2 - y1)),
        left:0, right:0, background:"rgba(242,166,90,.2)",
        borderTop:`1.5px solid ${C.accent}`, borderBottom:`1.5px solid ${C.accent}` }} />
    </div>
  );
}

/* ==================================================================== *
 * DETAIL PANEL
 * ==================================================================== */

const CERTAINTY_TEXT = {
  firm: "Well constrained — dated directly and widely agreed.",
  approximate: "Good consensus on the ballpark; the exact figure moves with new finds.",
  debated: "Actively argued over. One plausible estimate, not a settled fact.",
};

function DetailPanel({ e, onClose, onZoom }) {
  const cat = CATEGORIES[e.category];
  const g = GROUPS[cat.group];
  const range = isRange(e);

  return (
    <div style={{ position:"fixed", right:14, bottom:14, width:340, maxWidth:"calc(100vw - 28px)",
      background:C.panel, border:`1px solid ${C.border}`, borderLeft:`3px solid ${g.color}`,
      borderRadius:12, padding:"14px 16px", boxShadow:"0 12px 40px rgba(0,0,0,.55)", zIndex:50 }}>
      <button className="btn" onClick={onClose}
        style={{ position:"absolute", top:10, right:10, padding:"2px 7px", fontSize:12 }}>✕</button>

      <div style={{ fontSize:11, color:g.color, fontWeight:800, letterSpacing:".07em",
        textTransform:"uppercase", marginBottom:3 }}>
        {cat.emoji} {cat.name}
      </div>
      <div className="disp" style={{ fontSize:19, lineHeight:1.2, marginBottom:6, paddingRight:22 }}>
        {e.emoji} {e.label}
      </div>

      <div className="mono" style={{ fontSize:12.5, color:C.accent, marginBottom:2 }}>
        {range ? `${fmtFull(e.startYbp)} → ${fmtFull(e.endYbp)}` : fmtFull(e.ybp)}
      </div>
      {range && (
        <div className="mono" style={{ fontSize:11, color:C.sub, marginBottom:8 }}>
          lasting {fmtDuration(e.startYbp, e.endYbp)}
        </div>
      )}

      <p style={{ margin:"8px 0 10px", fontSize:13.5, lineHeight:1.5, color:C.ink }}>{e.blurb}</p>

      <div style={{ fontSize:11, color:C.sub, borderTop:`1px solid ${C.border}`, paddingTop:8,
        display:"flex", gap:8, alignItems:"flex-start" }}>
        <span style={{ flex:"none", fontWeight:800, color:e.certainty === "debated" ? C.accent : C.sub }}>
          {e.certainty.toUpperCase()}
        </span>
        <span style={{ lineHeight:1.4 }}>{CERTAINTY_TEXT[e.certainty]}</span>
      </div>

      <button className="btn" onClick={onZoom} style={{ marginTop:10, width:"100%" }}>
        ⤢ Zoom to this
      </button>
    </div>
  );
}

/* ==================================================================== *
 * LIST VIEW — the accessible, non-visual path to the same data
 * ==================================================================== */

function ListView({ query, onPick }) {
  const q = query.trim().toLowerCase();
  const rows = EVENTS
    .filter((e) => !q || e.label.toLowerCase().includes(q) || e.blurb.toLowerCase().includes(q))
    .sort((a, b) => evStart(b) - evStart(a));

  return (
    <div style={{ flex:1, overflow:"auto", padding:"0 14px 20px" }}>
      <table>
        <thead>
          <tr>
            <th style={{ width:150 }}>When</th>
            <th style={{ width:150 }}>Category</th>
            <th>Event</th>
            <th style={{ width:96 }}>Certainty</th>
          </tr>
        </thead>
        <tbody>
          {rows.map((e) => {
            const cat = CATEGORIES[e.category];
            const g = GROUPS[cat.group];
            return (
              <tr key={e.id} style={{ cursor:"pointer" }} onClick={() => onPick(e)}>
                <td className="mono" style={{ color:C.accent, fontSize:11.5, whiteSpace:"nowrap" }}>
                  {isRange(e) ? fmtFull(e.startYbp) : fmtFull(e.ybp)}
                </td>
                <td style={{ color:C.sub, fontSize:12 }}>
                  <span style={{ display:"inline-block", width:8, height:8, borderRadius:2,
                    background:g.color, marginRight:6 }} />
                  {cat.emoji} {cat.name}
                </td>
                <td>
                  <div style={{ fontWeight:700 }}>{e.emoji} {e.label}</div>
                  <div style={{ color:C.sub, fontSize:12, marginTop:2, lineHeight:1.45 }}>{e.blurb}</div>
                </td>
                <td style={{ color:e.certainty === "debated" ? C.accent : C.sub, fontSize:11 }}>
                  {e.certainty}
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>
      {rows.length === 0 && (
        <p style={{ color:C.sub, textAlign:"center", padding:"40px 0" }}>Nothing matches that search.</p>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<TimelineExplorer />);
</script>
